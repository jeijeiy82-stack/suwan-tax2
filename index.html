/* ============================================================
   토큰 — 블루 포인트 + 웜 뉴트럴, 모바일 앱 스타일
   ============================================================ */
:root {
  --blue:       #0066FF;
  --blue-d:     #0054D1;
  --blue-dd:    #00429E;
  --blue-weak:  #EAF2FE;
  --blue-line:  #C9DEFE;

  --fg:         #171719;
  --fg-2:       #4E5968;
  --fg-3:       #5B6472;   /* 연한 파랑·회색 면 위에서도 4.5:1 확보 (#6B7684는 4.09:1) */

  --page:       #EAEBEC;
  --card:       #FFFFFF;
  --surface:    #F7F7F8;

  --fill:       rgba(112,115,124,.05);
  --line:       rgba(112,115,124,.16);
  --line-2:     rgba(112,115,124,.22);

  --red:        #D32B22;
  --red-weak:   #FFF0EF;

  --r-sm: 8px; --r: 12px; --r-lg: 16px; --r-pill: 9999px;
  --bar-h: 76px;
  --font: "HDharmony", Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Malgun Gothic", "맑은 고딕", system-ui, sans-serif;
  --font-title: "Paperlogy", var(--font);   /* 제목·강조 숫자·버튼 */
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--fg);
  font-family: var(--font); font-size: 15px; line-height: 1.55;
  -webkit-font-smoothing: antialiased; letter-spacing: -.01em;
}
h1,h2,h3 { margin: 0; line-height: 1.35; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
fieldset { border: 0; margin: 0; padding: 0; min-inline-size: 0; }
fieldset + fieldset { margin-top: 22px; }
legend { padding: 0; display: block; inline-size: 100%; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }

/* 앱 셸 ------------------------------------------------------ */
.app {
  max-width: 480px; margin: 0 auto; min-height: 100dvh;
  background: var(--card); position: relative;
  display: flex; flex-direction: column;
}
@media (min-width: 481px) { .app { box-shadow: 0 0 0 1px var(--line); } }

/* 상단바 */
.appbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--card);
  padding-top: env(safe-area-inset-top);
}
.appbar-in {
  height: 54px; display: grid; grid-template-columns: 44px 1fr 44px;
  align-items: center;
}
.appbar h1 { font-size: 16px; font-weight: 600; text-align: center; }
.iconbtn {
  inline-size: 44px; block-size: 44px; display: grid; place-items: center;
  background: none; border: 0; cursor: pointer; color: var(--fg);
  border-radius: var(--r-pill);
}
.iconbtn:hover { background: var(--fill); }
.iconbtn:focus-visible { outline: 3px solid var(--blue); outline-offset: -2px; }
.iconbtn[hidden] { visibility: hidden; display: grid; }

.progress { height: 3px; background: var(--fill); }
.progress i { display: block; height: 100%; background: var(--blue); transition: width .3s ease; }

/* 화면 */
.screens { flex: 1; }
.screen { display: none; padding: 0 20px calc(var(--bar-h) + 20px); }
.screen.on { display: block; animation: slideFwd .28s cubic-bezier(.2,0,0,1) both; }
.screen.on.back { animation-name: slideBack; }
@keyframes slideFwd { from { opacity: 0; transform: translateX(16px); } }
@keyframes slideBack { from { opacity: 0; transform: translateX(-16px); } }

/* 하단 고정 버튼 */
.bottombar {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 30;
  max-width: 480px; margin: 0 auto;
  padding: 10px 20px calc(14px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, rgba(255,255,255,0), #fff 28%);
}
.btn {
  inline-size: 100%; min-block-size: 52px; border: 0; cursor: pointer;
  border-radius: var(--r); font-size: 16px; font-weight: 700;
  background: var(--blue); color: #fff;
  transition: background .15s ease;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:hover { background: var(--blue-d); }
.btn:active { background: var(--blue-dd); }
.btn:disabled { background: var(--line-2); color: #fff; cursor: not-allowed; }
.btn.ghost { background: var(--fill); color: var(--fg); }
.btn.ghost:hover { background: var(--line); }
.btn:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.btnrow { display: grid; grid-template-columns: 1fr 1.6fr; gap: 8px; }

.lead { font-size: 22px; font-weight: 700; letter-spacing: -.03em; margin: 8px 0 4px; line-height: 1.35; }
.lead-sub { font-size: 14px; color: var(--fg-3); margin-bottom: 20px; }
.sect { font-size: 13px; font-weight: 600; color: var(--fg-3); margin: 0 0 10px; }
p.sect { margin: 24px 0 10px; }

.select-group {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
  margin-bottom: 16px;
}
.select-field.full { grid-column: 1 / -1; }
.select-field {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.select-label {
  font-size: 13px;
  font-weight: 600;
  color: var(--fg-2);
}
.select-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.select-input {
  width: 100%;
  min-height: 50px;
  padding: 0 34px 0 14px;
  border: 1px solid var(--line);
  border-radius: var(--r);
  background: var(--card);
  font-size: 15px;
  font-weight: 600;
  color: var(--fg);
  font-family: inherit;
  appearance: none;
  -webkit-appearance: none;
  cursor: pointer;
  transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
}
.select-input:hover:not(:disabled) {
  border-color: var(--line-2);
}
.select-input:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-weak);
}
.select-input:disabled {
  background: var(--fill);
  color: var(--fg-3);
  cursor: not-allowed;
  opacity: .7;
}
.select-arrow {
  position: absolute;
  right: 12px;
  pointer-events: none;
  color: var(--fg-3);
  display: flex;
  align-items: center;
  justify-content: center;
}
.unit-preview-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--r-lg);
  padding: 16px;
  margin-top: 14px;
}

/* 선택 요약 배너 */
.picked {
  display: flex; align-items: center; gap: 10px;
  background: var(--blue-weak); border-radius: var(--r);
  padding: 12px 14px; margin-bottom: 16px;
}
.picked .txt { flex: 1; min-width: 0; }
.picked .t { font-size: 14px; font-weight: 700; }
.picked .s { font-size: 12.5px; color: var(--fg-2); margin-top: 1px; }
.picked button {
  background: var(--card); border: 0; border-radius: var(--r-pill);
  padding: 7px 13px; font-size: 12.5px; font-weight: 700; color: var(--blue);
  cursor: pointer; min-block-size: 34px;
}
.picked button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* 조건 세그먼트 */
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg.two { grid-template-columns: repeat(2, 1fr); }
.seg button {
  min-block-size: 48px; padding: 6px 2px; cursor: pointer;
  border: 1px solid var(--line); border-radius: var(--r); background: var(--card);
  font-size: 14px; font-weight: 600; color: var(--fg-2); letter-spacing: -.03em;
  transition: background .14s ease, border-color .14s ease, color .14s ease;
}
.seg button:hover:not([disabled]):not([aria-pressed="true"]) { background: var(--fill); }
.seg button[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; font-weight: 700; }
.seg button[disabled] { opacity: .4; cursor: not-allowed; background: var(--fill); }
.seg button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
.hint { font-size: 12.5px; color: var(--fg-3); margin-top: 8px; line-height: 1.55; }

/* 결과 */
.hero { padding: 4px 0 20px; }
.hero .k { font-size: 13px; color: var(--fg-3); font-weight: 600; }
.hero .v { font-size: 40px; font-weight: 700; letter-spacing: -.04em; line-height: 1.15; margin-top: 4px; }
.hero .v small { font-size: 22px; font-weight: 700; margin-left: 1px; }
.hero .e { font-size: 13px; color: var(--fg-3); margin-top: 3px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; margin-top: 12px;
  padding: 6px 11px; border-radius: var(--r-pill);
  font-size: 13px; font-weight: 700;
}
.badge.up { background: var(--red-weak); color: var(--red); }
.badge.down { background: var(--blue-weak); color: var(--blue-d); }

.panel { background: var(--surface); border-radius: var(--r-lg); padding: 16px; }
.panel + .panel { margin-top: 8px; }
.kv { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.kv + .kv { margin-top: 12px; }
.kv .k { font-size: 14px; color: var(--fg-2); font-weight: 500; }
.kv .v { font-size: 17px; font-weight: 700; }
.kv .v.none { font-size: 13px; font-weight: 600; color: var(--fg-3); }
.kv .sub { font-size: 11.5px; color: var(--fg-3); font-weight: 500; }

.note {
  margin-top: 10px; padding: 12px 14px; background: var(--blue-weak);
  border-radius: var(--r); font-size: 12.5px; color: var(--blue-dd); line-height: 1.6;
}

.forehead {
  background: var(--fg); color: #fff; border-radius: var(--r-lg);
  padding: 18px; margin-top: 10px; margin-bottom: 8px;
}
.forehead .k { font-size: 13px; color: rgba(255,255,255,.72); font-weight: 600; }
.forehead .v { font-size: 30px; font-weight: 700; letter-spacing: -.035em; margin-top: 3px; }
.forehead .x {
  display: inline-block; margin-top: 12px; padding: 5px 11px;
  background: rgba(255,255,255,.16); border-radius: var(--r-pill);
  font-size: 12.5px; font-weight: 700;
}
.fore { display: flex; flex-direction: column; }
.fore .r {
  display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 10px;
  min-block-size: 58px; padding: 10px 12px; cursor: pointer; text-align: left;
  background: none; border: 0; border-radius: var(--r); font: inherit;
}
.fore .r:hover { background: var(--fill); }
.fore .r:focus-visible { outline: 3px solid var(--blue); outline-offset: -2px; }
.fore .r[aria-pressed="true"] { background: var(--blue-weak); }
.fore .r .y { font-size: 13px; font-weight: 700; color: var(--fg-3); }
.fore .r .amt { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
.fore .r .up { font-size: 12.5px; font-weight: 700; color: var(--red); text-align: right; }
.fore .r .up b { display: block; font-size: 11px; font-weight: 700; color: var(--fg-3); }

/* 차트 */
.chart { inline-size: 100%; block-size: auto; display: block; overflow: visible; margin-top: 12px; }
.bar { cursor: pointer; }
.bar rect.fill { transition: opacity .15s ease; }
.bar:hover rect.fill { opacity: .85; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--fg-3); margin-top: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.swatch { inline-size: 11px; block-size: 11px; border-radius: 3px; flex: none; }

/* 표 */
.tablewrap { overflow-x: auto; margin-top: 6px; }
table { border-collapse: collapse; inline-size: 100%; font-size: 13px; }
th, td { padding: 9px 8px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
thead th { color: var(--fg-3); font-weight: 600; border-bottom: 1px solid var(--line-2); }
tbody tr + tr th, tbody tr + tr td { border-top: 1px solid var(--line); }
tbody tr.est th, tbody tr.est td { color: var(--fg-3); }
tbody tr.on th, tbody tr.on td { background: var(--blue-weak); font-weight: 700; color: var(--fg); }

/* 접기 */
details { margin-top: 10px; }
summary {
  cursor: pointer; list-style: none; padding: 12px 0;
  font-size: 13.5px; font-weight: 700; color: var(--blue);
  display: flex; align-items: center; justify-content: center; gap: 4px;
}
summary::-webkit-details-marker { display: none; }
summary::after { content: "˅"; font-weight: 700; }
details[open] summary::after { content: "˄"; }
.calc { font-size: 13px; padding: 4px 0 8px; }
.calc h3 { font-size: 11.5px; color: var(--fg-3); margin: 16px 0 8px; font-weight: 700; }
.calc h3:first-child { margin-top: 0; }
.calc dl { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; margin: 0; }
.calc dt { color: var(--fg-3); }
.calc dd { margin: 0; text-align: right; font-weight: 600; }
.calc .sum { border-top: 1px solid var(--line-2); padding-top: 8px; font-weight: 700; color: var(--fg); }
.calc .minus dd { color: var(--red); }
.tag {
  display: inline-block; font-size: 10.5px; padding: 1px 6px; border-radius: var(--r-pill);
  background: var(--fill); color: var(--fg-3); margin-left: 5px; font-weight: 700;
}

/* 문의 */
.contact { margin-top: 24px; background: var(--fg); border-radius: var(--r-lg); padding: 22px 18px; text-align: center; }
.contact p.l { font-size: 15px; font-weight: 600; color: #fff; line-height: 1.6; }
.contact .agent { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: -.02em; margin-top: 14px; }
.contact .agent-tel { font-size: 14px; color: rgba(255,255,255,.72); margin-top: 2px; }
.contact .agent-addr { font-size: 12.5px; color: rgba(255,255,255,.72); margin-top: 2px; line-height: 1.5; word-break: keep-all; }
.brand { display: flex; align-items: center; gap: 10px; margin-top: 14px;
         font-size: 13px; font-weight: 700; color: var(--fg-2); }
.brand img { inline-size: 44px; block-size: 44px; object-fit: contain; flex: none; }
.contact .agent-logo { inline-size: 72px; block-size: 72px; object-fit: contain; display: block; margin: 16px auto 0; }
.cta {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  min-block-size: 56px; margin-top: 16px; padding: 0 16px;
  background: var(--blue); color: #fff; text-decoration: none;
  border-radius: var(--r); font-size: 18px; font-weight: 700;
}
.cta:hover { background: var(--blue-d); }
.cta:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

/* 주의 */
.notes { margin-top: 24px; font-size: 11.5px; color: var(--fg-3); }
.notes h2 { font-size: 12px; color: var(--fg-2); margin-bottom: 8px; }
.notes ul { margin: 0; padding-left: 15px; }
.notes li { margin-bottom: 5px; line-height: 1.6; }
.notes strong { color: var(--fg-2); font-weight: 700; }

/* 테마 글꼴: 제목·큰 숫자·버튼·중개사명 */
h1, h2, .lead, .brand, .sect, .hero .v, .forehead .v, .kv .v, .fore .r .amt,
.btn, .cta, .picked .t, .contact p.l, .contact .agent, summary {
  font-family: var(--font-title);
}

/* 인쇄: 결과 화면을 종이 한 장 흐름으로 */
@media print {
  @page { margin: 12mm; }
  body, .app { background: #fff; box-shadow: none; }
  .app { max-width: none; min-height: 0; }
  .appbar { position: static; }
  .progress, .iconbtn, .bottombar, .cta { display: none !important; }
  .screen { padding-bottom: 0; animation: none !important; }
  .panel, .forehead, .contact, .fore .r, table { break-inside: avoid; }
  .contact, .forehead, .panel, .note, .picked, .brand {
    -webkit-print-color-adjust: exact; print-color-adjust: exact;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}
</style>

const TaxEngine = (() => {

    const pref = kind === "oneHouse" && item.officialPrice <= cfg.preferentialRateMaximumOfficialPrice;

    const applied = pt(base, br);
    const tax = mt(base, br);
    const src = { baseTax: tax, taxableBase: base };
    const share = item.ownershipShare;

      fullOfficialPrice: item.officialPrice,
      fairMarketValueRatio: fmv,
      uncappedFullTaxableBase: R(capped.uncapped),
      fullTaxableBaseCap: capped.cap === null ? null : R(capped.cap),
      taxableBaseCapApplied: capped.applied,
      fullTaxableBase: R(base),
      preferentialRateApplied: pref,
      appliedRate: { rate: applied.rate, pd: applied.pd },
      fullBaseTax: R(tax),
      baseTax: R(tax * share),
      localEducationTax: R(src[cfg.surtaxes.localEducation.base] * cfg.surtaxes.localEducation.rate * share),
      cityAreaTax: R(src[cfg.surtaxes.cityArea.base] * cfg.surtaxes.cityArea.rate * share),
      get totalTax() { return this.baseTax + this.localEducationTax + this.cityAreaTax; },
    };
  };

  /* ---- 종부세 ---- */
  const rr = (ptaxes, creditFmv, cfg) => {

    const br = cfg.propertyTax.brackets.general;
    return { taxableBase: R(base), appliedRate: pt(base, br),
             calculatedTax: R(mt(base, br)),
             propertyTax: R(ptaxes.reduce((a, t) => a + t.fullBaseTax, 0)) };

  const ir = (ded, kind, items, total, residentTotal) => {
    if (kind === "oneHouse") return ded.oneHouse[items[0].residency];
    if (ded.multiHouse.kind === "fixed") return ded.multiHouse.amount;
    const share = total > 0 ? residentTotal / total : 0;
    return ded.multiHouse.base + ded.multiHouse.residentHomeShareMaximum * share;

  const ar = (ct, kind, homeCount, adjusted) => {

      ? ct.fairMarketValueRatios.multiHouse.threeOrMoreOrAdjusted

  const Cn = (kind, ownerAge, item, residenceYears, netTax, cfg) => {

    if (netTax <= 0) return { status: "notApplicable", reason: "noComprehensiveTax", amount: 0 };
    const ageRate = xn(ownerAge, cfg.ageRates);
    const holdRate = xn(item.holdingYears, cfg.holdingPeriodRates);
    const resRate = xn(residenceYears, cfg.residencePeriodRates);
    const periodRate = Sn[cfg.periodCreditKind](holdRate, resRate);
    const nominal = ageRate + periodRate;
    const applied = Math.min(nominal, cfg.maximumRate);
    const raw = netTax * applied;
    const amount = cfg.amountCap === null ? raw : Math.min(raw, cfg.amountCap);
    return { status: "computed", ageRate, holdingPeriodRate: holdRate, residencePeriodRate: resRate,
             periodRate, nominalRate: nominal, appliedRate: applied, calculatedAmount: R(raw),
             amountCap: cfg.amountCap, amount: R(amount),
             isRateCapped: nominal > cfg.maximumRate,

    if (curNet <= 0) return { status: "notApplicable", excessAmount: 0 };
    if (!prior) return { status: "notComputed", excessAmount: 0 };
    const p = prior.propertyBaseTax;

      ? prior.comprehensiveCalculatedTax : prior.comprehensiveTax;
    if (p === undefined || p === null || c === undefined || c === null)
      return { status: "notComputed", excessAmount: 0 };
    const priorBase = p + c;

    return { status: "computed", rate: capCfg.rate, priorYearBase: R(priorBase),

    };
    const ptaxes = [pr(item, kind, cfg.propertyTax)];
    const comp = cr([item], kind, homeCount, ptaxes, opt.ownerAge, cfg, prior, opt.adjusted);
    const propertyTaxTotal = ptaxes.reduce((a, t) => a + t.totalTax, 0);
    return {
      year, property: ptaxes[0], comprehensive: comp,
      propertyTaxTotal, holdingTaxTotal: propertyTaxTotal + comp.totalTax,
      priorForNext: { propertyBaseTax: ptaxes.reduce((a, t) => a + t.baseTax, 0),
                      comprehensiveCalculatedTax: comp.netTax,
                      comprehensiveTax: comp.payableTax },
    };
  }

  /**
   * 2025~2030 순차 계산.
   * 세부담상한이 전년도 세액을 요구하므로 반드시 순서대로 이어서 계산해야 한다.
   * 전년 공시가격이 있으면 과세표준상한(지방세법 §110③)에 쓴다. 2025년은 2024 공시가격이 데이터에 있을 때만 적용.
   */
  function calcSeries(priceByYear, opt) {
    const out = [];
    let prior = null;
    for (const year of YEARS) {
      const p = priceByYear[year - 1] || null;
      const r = calcYear(year, priceByYear[year], p, opt, prior);
      out.push(r);
      prior = r.priorForNext;
    }
    return out;
  }

  return { calcSeries, YEAR_CONFIG };
})();

const FIRST_YEAR = 2025;
const LAST_ACTUAL_YEAR = 2026;
const YEARS = [2025, 2026, 2027, 2028, 2029, 2030];
const GROWTH_BANDS = [["0%", 0], ["3%", 0.03], ["5%", 0.05], ["10%", 0.10]];

/* ---------- 데이터 인덱스 ---------- */
const DISTRICT_NAME = "수완지구";
const COMPLEXES = APT_DATA.complexes;
const YI = Object.fromEntries(APT_DATA.years.map((y, i) => [y, 4 + i]));
let D = { dongs: [], areas: [], rows: [] };
const byDong = new Map();
function useComplex(idx) {
  D = idx === null ? { dongs: [], areas: [], rows: [] } : COMPLEXES[idx];
  byDong.clear();
  for (const r of D.rows) {
    const dong = D.dongs[r[0]];
    if (!byDong.has(dong)) byDong.set(dong, []);
    byDong.get(dong).push(r);
  }
}
const priceOf = (row, year) => row[YI[year]] * APT_DATA.unit;

function projectPrices(row) {
  const out = { 2025: priceOf(row, 2025), 2026: priceOf(row, 2026) };
  if (YI[2024] !== undefined && row[YI[2024]] > 0) out[2024] = priceOf(row, 2024);
  for (let i = 1; i <= 4; i++) out[2026 + i] = Math.round(out[2026] * Math.pow(1 + state.growth, i));
  return out;
}

const nf = new Intl.NumberFormat("ko-KR");
const won = n => "약 " + nf.format(Math.round(n)) + "원";
const manwon = n => "약 " + nf.format(Math.round(n / 10000)) + "만원";
const eok = n => "약 " + (n / 1e8).toFixed(2) + "억";
const pct = r => (r * 100).toFixed(r * 100 % 1 === 0 ? 0 : 2) + "%";
function eokman(n) {
  const e = Math.floor(n / 1e8), m = Math.floor((n % 1e8) / 1e4);
  if (e && m) return `약 ${e}억 ${nf.format(m)}만원`;
  if (e) return `약 ${e}억원`;
  return `약 ${nf.format(m)}만원`;
}
const money = n => n >= 1e8 ? eokman(n) : manwon(n);
const signedManwon = n => (n >= 0 ? "+" : "−") + manwon(Math.abs(n));

/* ---------- 상태 ---------- */
const AGE_BANDS  = [["60세 미만", 0], ["60—64세", 60], ["65—69세", 65], ["70세 이상", 70]];
const TERM_BANDS = [["5년 미만", 0], ["5—9년", 5], ["10—14년", 10], ["15년 이상", 15]];
const SCREENS = ["unit", "cond", "result"];
const TITLES  = { unit: "세대 선택", cond: "내 조건 입력", result: "계산 결과" };

const state = {
  screen: "unit",
  complex: null, dong: null, ho: null,
  oneHouse: true, ownerAge: 0, holdingYears: 0,
  residing: true, residenceYears: 0,
  adjusted: false,     // 조정대상지역 — 1주택은 영향 없음, 2028년 이후 다주택에서만 갈림
  focusYear: 2027,
  growth: 0,           // 2027년 이후 공시가격 연 상승률 가정
};
const openPanels = new Set();

/* ---------- 화면 전환 ---------- */
function goto(screen, back) {
  state.screen = screen;
  SCREENS.forEach(s => {
    const el = document.getElementById("s-" + s);
    el.classList.toggle("on", s === screen);
    el.classList.toggle("back", s === screen && !!back);

  document.getElementById("apptitle").textContent = TITLES[screen];
  document.getElementById("bar").style.width =
    ((SCREENS.indexOf(screen) + 1) / SCREENS.length * 100).toFixed(0) + "%";
  const b = document.getElementById("back");
  b.hidden = screen === "unit";
  window.scrollTo(0, 0);
  render();
}

  const row = currentRow();

const currentRow = () =>
  (byDong.get(state.dong) || []).find(r => String(r[1]) === String(state.ho)) || null;

/* ---------- 2. 조건 ---------- */
function segment(host, items, isOn, onPick, isDisabled) {
  host.textContent = "";
  items.forEach(([label, value]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label;
    b.setAttribute("aria-pressed", String(isOn(value)));
    if (isDisabled && isDisabled(value)) b.disabled = true;
    b.addEventListener("click", () => { onPick(value); render(); });
    host.appendChild(b);
  });
}

function renderCondScreen() {
  const row = currentRow();
  if (row) {
    document.getElementById("picked").innerHTML =
      `<div class="txt"><p class="t">${D.apt} ${state.dong}동 ${state.ho}호</p>
       <p class="s">전용 ${D.areas[row[3]]}㎡ · ${row[2]}층 · 2026년 공시 ${eokman(priceOf(row, 2026))}</p></div>`;
  }

  segment(document.getElementById("seg-onehouse"), [["1세대 1주택", true], ["아니요 (다주택 등)", false]],
    v => state.oneHouse === v, v => { state.oneHouse = v; });

  const age = document.getElementById("seg-age");
  segment(age, AGE_BANDS, v => state.ownerAge === v, v => { state.ownerAge = v; });
  const hold = document.getElementById("seg-hold");
  segment(hold, TERM_BANDS, v => state.holdingYears === v, v => {
    state.holdingYears = v;
    if (state.residenceYears > v) state.residenceYears = v;
  });

  segment(document.getElementById("seg-live"), [["거주중", true], ["비거주중", false]],
    v => state.residing === v, v => { state.residing = v; });

  const resideField = document.getElementById("field-reside");
  if (resideField) {
    resideField.hidden = !state.residing;
    resideField.style.display = state.residing ? "" : "none";
  }

  if (state.residing) {
    segment(document.getElementById("seg-reside"), TERM_BANDS,
      v => state.residenceYears === v, v => { state.residenceYears = v; },
      v => v > state.holdingYears);
  }

  segment(document.getElementById("seg-growth"), GROWTH_BANDS,
    v => state.growth === v, v => { state.growth = v; });

  const hints = [];
  if (!state.oneHouse) hints.push("1세대 1주택이 아니면 재산세 특례(낮은 공정시장가액비율·세율)와 종부세 고령자·장기보유 공제가 적용되지 않아요.");
  if (!state.residing) hints.push("비거주 상태에서는 거주 기간 공제가 적용되지 않아요.");
  else if (state.holdingYears === 0) hints.push("보유 기간을 5년 미만으로 잡아서 그보다 긴 거주 기간은 고를 수 없어요.");
  hints.push("거주 기간 공제는 2027년부터 생겨요. 2026년 값은 거주 기간을 바꿔도 달라지지 않습니다.");
  document.getElementById("cond-hint").textContent = hints.join(" ");

/* ---------- 3. 결과 ---------- */
function bindDetails(root) {
  root.querySelectorAll("details[data-keep]").forEach(d => {
    const key = d.dataset.keep;
    d.open = openPanels.has(key);
    d.addEventListener("toggle", () => d.open ? openPanels.add(key) : openPanels.delete(key));
  });
}

function renderResult(series) {
  const host = document.getElementById("result");
  const i = YEARS.indexOf(LAST_ACTUAL_YEAR);
  const cur = series[i], prev = series[i - 1], c = cur.comprehensive;
  const d = cur.holdingTaxTotal - prev.holdingTaxTotal;

  const flags = [];
  if (cur.property.taxableBaseCapApplied)
    flags.push(`재산세 과세표준상한으로 과표가 ${money(cur.property.uncappedFullTaxableBase - cur.property.fullTaxableBase)} 줄었어요`);
  if (c.status === "taxable" && c.taxBurdenCap.status === "computed" && c.taxBurdenCap.excessAmount > 0)
    flags.push(`세부담상한으로 종부세에서 ${money(c.taxBurdenCap.excessAmount)} 차감됐어요`);
  if (c.status === "taxable" && c.taxCredit.status === "computed" && c.taxCredit.amount > 0)
    flags.push(`세액공제 ${pct(c.taxCredit.appliedRate)}로 ${money(c.taxCredit.amount)} 줄었어요`);

  host.innerHTML = `
    <div class="hero">
      <p class="k">2026년 예상 보유세 총액 · ${state.oneHouse ? "1세대 1주택" : "1주택 아님"} 기준</p>
      <p class="v num"><small style="font-size:24px;font-weight:700;margin-right:3px;">약</small>${nf.format(Math.round(cur.holdingTaxTotal / 1e4))}<small>만원</small></p>
      <p class="e num">(${won(cur.holdingTaxTotal)})</p>
      <p class="badge ${d > 0 ? "up" : "down"} num">${d > 0 ? "▲" : "▼"} 2025년보다 ${manwon(Math.abs(d))}
        ${d > 0 ? "늘어요" : "줄어요"}</p>
    </div>
    <div class="panel">
      <div class="kv"><span class="k">재산세</span><span class="v num">${manwon(cur.propertyTaxTotal)}</span></div>
      <div class="kv"><span class="k">종합부동산세</span>`
      + (c.status === "notTaxable"
        ? `<span class="v none">대상 아님</span>`
        : `<span class="v num">${manwon(c.totalTax)}</span>`)
      + `</div>

function renderForecast(series) {
  const host = document.getElementById("forecast");
  const base = series[YEARS.indexOf(LAST_ACTUAL_YEAR)].holdingTaxTotal;
  const future = series.filter(s => s.year > LAST_ACTUAL_YEAR);
  const last = future[future.length - 1];

  host.innerHTML = `
    <div class="fore">${future.map(s => `
      <button type="button" class="r" data-year="${s.year}" aria-pressed="${s.year === state.focusYear}">
        <span class="y num">${s.year}</span>
        <span class="amt num">${manwon(s.holdingTaxTotal)}</span>
        <span class="up num">${signedManwon(s.holdingTaxTotal - base)}<b>${(s.holdingTaxTotal / base).toFixed(1)}배</b></span>
      </button>`).join("")}</div>
    <div class="forehead">
      <p class="k">${last.year}년에는</p>
      <p class="v num">${manwon(last.holdingTaxTotal)}</p>
      <p class="x num">지금보다 ${manwon(Math.abs(last.holdingTaxTotal - base))} ${last.holdingTaxTotal >= base ? "더" : "덜"} · ${(last.holdingTaxTotal / base).toFixed(1)}배</p>
    </div>
  `;
  host.querySelectorAll(".fore .r").forEach(b =>
    b.addEventListener("click", () => { state.focusYear = Number(b.dataset.year); render(); }));

function renderDetail(r, key) {
  const p = r.property, c = r.comprehensive;
  const row = (k, v) => `<dt>${k}</dt><dd class="num">${v}</dd>`;
  const L = [];

  L.push(`<h3>재산세</h3><dl>`);
  L.push(row("공시가격", won(p.fullOfficialPrice)));
  L.push(row("공정시장가액비율", pct(p.fairMarketValueRatio)));
  L.push(row("과세표준 (상한 전)", won(p.uncappedFullTaxableBase)));
  L.push(p.fullTaxableBaseCap !== null
    ? row(`과세표준상한액 <span class="tag">${p.taxableBaseCapApplied ? "적용" : "미적용"}</span>`, won(p.fullTaxableBaseCap))

  L.push(row("과세표준", won(p.fullTaxableBase)));
  L.push(row(`적용세율 <span class="tag">${p.preferentialRateApplied ? "1주택 특례" : "표준"}</span>`,
    `${pct(p.appliedRate.rate)} − ${nf.format(p.appliedRate.pd)}`));
  L.push(row("재산세 본세", won(p.baseTax)));
  L.push(row("지방교육세", won(p.localEducationTax)));
  L.push(row("도시지역분", won(p.cityAreaTax)));
  L.push(`<dt class="sum">재산세 소계</dt><dd class="sum num">${won(p.totalTax)}</dd></dl>`);

  L.push(`<h3>종합부동산세</h3><dl>`);
  if (c.status === "notTaxable") {
    L.push(row("과세기준금액", won(c.taxableThreshold)));
    L.push(row("판정", "기준금액 이하 · 과세 대상 아님"));
    L.push(`<dt class="sum">종부세 소계</dt><dd class="sum num">${won(0)}</dd>`);
  } else {
    L.push(row("합산 공시가격", won(c.ownedOfficialPriceTotal)));
    L.push(row("기본공제", won(c.basicDeduction)));
    L.push(row("공정시장가액비율", pct(c.fairMarketValueRatio)));
    L.push(row("과세표준", won(c.taxableBase)));
    L.push(row("세율", `${pct(c.appliedRate.rate)} − ${nf.format(c.appliedRate.pd)}`));
    L.push(row("종부세 산출세액", won(c.baseTax)));
    L.push(`<div class="minus" style="display:contents"><dt>재산세 중복분 공제</dt><dd class="num">−${won(c.propertyTaxCredit)}</dd></div>`);
    L.push(row("공제 후 산출세액", won(c.netTax)));
    if (c.taxCredit.status === "computed") {
      const cap = c.taxCredit.isAmountCapped ? ` <span class="tag">한도 ${manwon(c.taxCredit.amountCap)}</span>` : "";
      L.push(`<div class="minus" style="display:contents"><dt>고령자·장기보유 공제 ${pct(c.taxCredit.appliedRate)}${cap}</dt>`
        + `<dd class="num">−${won(c.taxCredit.amount)}</dd></div>`);
    } else {
      L.push(row(`세액공제 <span class="tag">${c.taxCredit.reason === "notOneHouse" ? "1주택 아님" : "해당 없음"}</span>`, won(0)));
    }
    if (c.taxBurdenCap.status === "computed") {
      L.push(`<div class="minus" style="display:contents"><dt>세부담상한 (전년 ${manwon(c.taxBurdenCap.priorYearBase)} × ${c.taxBurdenCap.rate.toFixed(1)}배)</dt>`
        + `<dd class="num">−${won(c.taxBurdenCap.excessAmount)}</dd></div>`);
    } else {
      L.push(row(`세부담상한 <span class="tag">전년 자료 없음</span>`, won(0)));
    }
    L.push(row("결정세액", won(c.payableTax)));
    L.push(row("농어촌특별세", won(c.ruralSpecialTax)));
    L.push(`<dt class="sum">종부세 소계</dt><dd class="sum num">${won(c.totalTax)}</dd>`);
  }
  L.push(`</dl><h3>합계</h3><dl>`);
  L.push(`<dt class="sum">${r.year}년 보유세</dt><dd class="sum num">${won(r.holdingTaxTotal)}</dd></dl>`);

  return `<details data-keep="${key}"><summary>${r.year}년 계산 과정 보기</summary><div class="calc">${L.join("")}</div></details>`;
}

/* ---------- 차트 ---------- */
function renderTrend(series, prices) {
  const host = document.getElementById("trend");
  const W = Math.max(300, Math.round(host.clientWidth || 440));
  const narrow = W < 460;
  const H = 232, PAD_B = 44, PAD_T = 30, PAD_X = 2;
  const fsV = narrow ? 11 : 12, fsY = narrow ? 12 : 13, fsS = narrow ? 10 : 11;
  const slot = (W - PAD_X * 2) / series.length;
  const bw = Math.min(60, slot * 0.66);
  const max = Math.max(...series.map(s => s.holdingTaxTotal), 1);

  const bars = series.map((s, i) => {
    const est = s.year > LAST_ACTUAL_YEAR;
    const anchor = s.year === LAST_ACTUAL_YEAR;
    const on = !anchor && s.year === state.focusYear;
    const h = Math.max(2, (H - PAD_B - PAD_T) * (s.holdingTaxTotal / max));
    const x = PAD_X + slot * i + (slot - bw) / 2, y = H - PAD_B - h;
    const fill = anchor ? "var(--blue)" : on ? "var(--blue-dd)" : est ? "url(#hatch)" : "#C8CDD4";
    const dashed = est && !on;
    return `<g class="bar" role="button" tabindex="0" data-year="${s.year}"
        aria-label="${s.year}년 보유세 ${manwon(s.holdingTaxTotal)}${est ? " 추정" : ""}${anchor ? " 기준" : ""}">
      <rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" class="fill" fill="${fill}"
            stroke="${dashed ? "var(--line-2)" : "none"}" stroke-dasharray="${dashed ? "4 3" : "0"}"
            stroke-width="${dashed ? 1.2 : 0}"></rect>
      <text x="${x + bw / 2}" y="${y - 8}" text-anchor="middle" font-size="${fsV}"
            font-weight="${anchor || on ? 700 : 500}"
            fill="${anchor ? "var(--blue)" : on ? "var(--blue-dd)" : "var(--fg-3)"}">약 ${nf.format(Math.round(s.holdingTaxTotal / 1e4))}</text>
      <text x="${x + bw / 2}" y="${H - PAD_B + 19}" text-anchor="middle" font-size="${fsY}"
            font-weight="${anchor || on ? 700 : 500}"
            fill="${anchor || on ? "var(--fg)" : "var(--fg-3)"}">${String(s.year).slice(2)}</text>
      <text x="${x + bw / 2}" y="${H - PAD_B + 35}" text-anchor="middle" font-size="${fsS}"
            fill="var(--fg-3)">${eok(prices[s.year])}</text>
    </g>`;
  }).join("");

  host.innerHTML = `
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img"
         aria-label="2025년부터 2030년까지 보유세 추이. 정확한 값은 아래 표에 있습니다.">
      <defs><pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <rect width="7" height="7" fill="#E6EBF2"></rect>
        <line x1="0" y1="0" x2="0" y2="7" stroke="#C3CCDA" stroke-width="3"></line>
      </pattern></defs>
      <line x1="${PAD_X}" y1="${H - PAD_B}" x2="${W - PAD_X}" y2="${H - PAD_B}"
            stroke="var(--line)" stroke-width="1"></line>
      ${bars}
    </svg>
    <div class="legend">
      <span><i class="swatch" style="background:var(--blue)"></i>2026년 (기준)</span>
      <span><i class="swatch" style="background:#C8CDD4"></i>2025년</span>
      <span><i class="swatch" style="background:#E6EBF2;border:1px dashed var(--line-2)"></i>추정</span>
    </div>
    <p class="hint">막대 위는 보유세(만원), 아래는 그 해 공시가격입니다.</p>
    ${renderDetail(series[YEARS.indexOf(state.focusYear)], "future")}
    ${renderTable(series, prices)}
  `;
  host.querySelectorAll(".bar").forEach(g => {
    const pick = () => { state.focusYear = Number(g.dataset.year); render(); };
    g.addEventListener("click", pick);
    g.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(); }
    });
  });
  bindDetails(host);
}

function renderTable(series, prices) {
  const rows = series.map(s => {
    const cls = [s.year > LAST_ACTUAL_YEAR ? "est" : "", s.year === state.focusYear ? "on" : ""].filter(Boolean).join(" ");
    const c = s.comprehensive;
    return `<tr class="${cls}"><th scope="row">${s.year}${s.year > LAST_ACTUAL_YEAR ? " *" : ""}</th>
      <td class="num">${eok(prices[s.year])}</td>
      <td class="num">약 ${nf.format(s.propertyTaxTotal)}원</td>
      <td class="num">${c.status === "notTaxable" ? "—" : "약 " + nf.format(c.totalTax) + "원"}</td>
      <td class="num">약 ${nf.format(s.holdingTaxTotal)}원</td></tr>`;
  }).join("");
  return `<details data-keep="table"><summary>연도별 표 보기</summary><div class="tablewrap">
    <table><thead><tr><th scope="col">연도</th><th scope="col">공시가격</th>
      <th scope="col">재산세</th><th scope="col">종부세</th><th scope="col">합계</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    <p class="hint">* 추정 공시가격 기준 · 단위 원</p></details>`;
}

function renderNotes() {
  document.getElementById("notelist").innerHTML = [
    `<strong>2025·2026년은 고시된 공시가격</strong>, <strong>2027년부터는 매년 ${Math.round(state.growth * 100)}%씩 오른다고 가정</strong>한 추정치입니다. 상승률은 조건 화면에서 바꿀 수 있습니다.`,
    `2027년 이후 종부세는 <strong>국회 심의 중인 2026년 세제개편안(정부안, 2026.8.3 발표)</strong> 기준이라 확정 내용에 따라 달라질 수 있습니다. 재산세 1주택 공정시장가액비율(43~45%)도 2026년분까지만 확정돼 있어 같은 비율이 이어진다고 가정했습니다.`,
    `재산세 고지서에 함께 나오는 <strong>지역자원시설세(소방분)</strong>는 포함하지 않아, 실제 고지액보다 수천~수만원 적게 나올 수 있습니다.`,
    state.oneHouse
      ? `종부세는 세대 합산 과세지만 <strong>선택한 이 집 하나만</strong> 계산합니다.`
      : `1주택이 아니면 종부세는 <strong>보유한 모든 주택의 공시가격 합계</strong>에서 9억원을 빼고 계산합니다. 이 계산기는 <strong>선택한 이 집 하나만</strong> 넣으므로 종부세가 실제보다 적게(또는 0원으로) 나올 수 있습니다. 재산세는 집마다 따로 매겨져 그대로 맞습니다.`,
    `합산배제, 상속주택·일시적 2주택 특례, 토지분 종부세는 계산하지 않아 해당하면 실제보다 높게 나올 수 있습니다.`,
    `참고용 예측값이며 <strong>실제 고지세액과 다를 수 있습니다.</strong>`,
  ].map(t => `<li>${t}</li>`).join("");
}

/* ---------- 하단 버튼 ---------- */
function renderBottom() {
  const host = document.getElementById("bottombar");
  host.textContent = "";
  const mk = (label, cls, fn, disabled) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn" + (cls ? " " + cls : ""); b.textContent = label;
    if (disabled) b.disabled = true; else b.addEventListener("click", fn);
    return b;
  };
  if (state.screen === "unit") {
    host.appendChild(mk(state.ho ? `${state.dong}동 ${state.ho}호로 계속하기` : "세대를 선택해 주세요",
      "", () => goto("cond"), !state.ho));
  } else if (state.screen === "cond") {
    host.appendChild(mk("계산하기", "", () => goto("result")));
  } else {
    const rowEl = document.createElement("div");
    rowEl.className = "btnrow";
    rowEl.appendChild(mk("세대 변경", "ghost", () => goto("unit", true)));
    rowEl.appendChild(mk("조건 수정", "", () => goto("cond", true)));
    host.appendChild(rowEl);
  }
}

/* ---------- 렌더 ---------- */
function render() {
  if (state.screen === "unit") renderUnitScreen();
  if (state.screen === "cond") renderCondScreen();
  if (state.screen === "result") {
    renderNotes();
    document.getElementById("forecast-basis").textContent =
      `공시가격 연 ${Math.round(state.growth * 100)}% 상승 가정 · 2027년~ 세율은 국회 심의 중인 정부 개편안 기준 추정치`;
    const row = currentRow();
    if (row) {
      const prices = projectPrices(row);
      const series = TaxEngine.calcSeries(prices, state);
      renderResult(series);
      renderForecast(series);
      renderTrend(series, prices);
    }
  }
  renderBottom();
}

/* ---------- 초기화 ---------- */
function init() {
  document.getElementById("back").addEventListener("click", () => {
    const i = SCREENS.indexOf(state.screen);
    if (i > 0) goto(SCREENS[i - 1], true);
  });
  renderNotes();
  render();

  let t = null, lastW = window.innerWidth;
  window.addEventListener("resize", () => {
    if (window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    clearTimeout(t);
    t = setTimeout(render, 150);
  });
}
document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
